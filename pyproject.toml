[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-cup-predictor"
version = "1.0.0"
description = "Predictor de fútbol de selecciones: fuerzas bayesianas, xG de StatsBomb, Dixon-Coles y Breaking News Engine"
readme = "README.md"
requires-python = ">=3.11"
# núcleo: lo que necesitan el ciclo diario, la web, las ligas y selecciones
# (los scrapers usan urllib; no hace falta requests ni un parser de HTML)
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# modelo supervisado (src/ml): logística, gradient boosting y guardar los modelos
ml = ["scikit-learn>=1.4.0", "joblib>=1.3.0"]
# crónicas generativas del narrador; sin esto (o sin clave) usa plantillas
llm = ["anthropic>=0.28.0"]
# solo pytest: lo que necesita la imagen de Docker para correr la suite
test = ["pytest>=8.2.0"]
dev = ["world-cup-predictor[ml,llm]", "pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.4.0",
       "mypy>=1.10.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# catálogo de eventos: una fila por evento se lee mejor que partida
"src/agents/breaking_news.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
explicit_package_bases = true
# pandas, sklearn y joblib no traen stubs instalados
ignore_missing_imports = true
